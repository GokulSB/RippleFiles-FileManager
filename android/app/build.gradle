plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.ripple.filemanager"
    compileSdk 36

    defaultConfig {
        applicationId "com.ripple.filemanager"
        minSdk 26
        targetSdk 36
        versionCode 33
        versionName "2.0.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file("local.properties")
    if (localPropertiesFile.exists()) {
        localProperties.load(new FileInputStream(localPropertiesFile))
    }

    buildTypes {
        debug {
            buildConfigField "String", "TEST_WEBDAV_URL", "\"${localProperties.getProperty('testWebdavUrl', '')}\""
            buildConfigField "String", "TEST_WEBDAV_USER", "\"${localProperties.getProperty('testWebdavUser', '')}\""
            buildConfigField "String", "TEST_WEBDAV_PASSWORD", "\"${localProperties.getProperty('testWebdavPassword', '')}\""
            buildConfigField "boolean", "TEST_WEBDAV_ALLOW_SELF_SIGNED", "${localProperties.getProperty('testWebdavAllowSelfSigned', 'false')}"
        }
    }

    signingConfigs {
        release {
            storeFile file("../keystore.jks")
            storePassword "password123"
            keyAlias "upload"
            keyPassword "password123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        aidl true
        buildConfig true
    }
    packaging {
        jniLibs.useLegacyPackaging = true
        resources.excludes.add("META-INF/DEPENDENCIES")
        resources.excludes.add("META-INF/LICENSE")
        resources.excludes.add("META-INF/LICENSE.txt")
        resources.excludes.add("META-INF/license.txt")
        resources.excludes.add("META-INF/NOTICE")
        resources.excludes.add("META-INF/NOTICE.txt")
        resources.excludes.add("META-INF/notice.txt")
        resources.excludes.add("META-INF/ASL2.0")
        resources.excludes.add("META-INF/*.kotlin_module")
    }
}

composeCompiler {
    metricsDestination = layout.buildDirectory.dir("compose_metrics")
    reportsDestination = layout.buildDirectory.dir("compose_metrics")
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'androidx.window:window:1.3.0'
    implementation 'androidx.compose.material3.adaptive:adaptive:1.0.0'
    implementation 'androidx.compose.material3.adaptive:adaptive-layout:1.0.0'
    implementation 'androidx.compose.material3.adaptive:adaptive-navigation:1.0.0'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.google.api-client:google-api-client-android:1.33.0'
    implementation('com.google.apis:google-api-services-drive:v3-rev20220815-2.0.0') {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
dependencies {
    implementation 'io.coil-kt:coil-video:2.6.0'
    def media3_version = "1.5.0"
    implementation "androidx.media3:media3-exoplayer:${media3_version}"
    implementation "androidx.media3:media3-ui:${media3_version}"
    implementation "androidx.media3:media3-session:${media3_version}"
} 
dependencies {
    // Shizuku
    def shizuku_version = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"
    
    // libsu
    def libsu_version = '6.0.0'
    implementation "com.github.topjohnwu.libsu:core:$libsu_version"
    implementation "com.github.topjohnwu.libsu:io:$libsu_version"
    
    implementation "androidx.documentfile:documentfile:1.0.1"
}
dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
}

dependencies {
    // Dropbox
    implementation 'com.dropbox.core:dropbox-core-sdk:5.4.5'

    // SMB
    implementation 'com.hierynomus:smbj:0.13.0'
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation 'com.google.code.gson:gson:2.11.0'

    // FTP (Apache Commons Net)
    implementation 'commons-net:commons-net:3.11.1'

    // SFTP (sshj)
    implementation 'com.hierynomus:sshj:0.38.0'
    
    // WebDAV
    implementation 'com.github.thegrizzlylabs:sardine-android:0.8'

    // Archives
    implementation("io.github.realburst:unrar5j:v2.0.3")
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    
    // Testing
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    
    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}

configurations {
    all {
        // sshj pulls in jdk18on variants; smbj pulls in jdk15to18 variants.
        // Exclude all jdk15to18 modules so the newer jdk18on wins.
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15to18'
        exclude group: 'org.bouncycastle', module: 'bcutil-jdk15to18'
    }
}
